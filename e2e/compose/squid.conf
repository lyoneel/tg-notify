# Test-only squid config for the tg-notify proxy e2e Compose stack.
# World-open on purpose; never use this outside the test network.
# The access log goes to the image's default writable path instead of
# /dev/stdout because squid's worker runs as user 'proxy', which
# cannot open /dev/stdout (ubuntu/squid:latest, squid 6.13, verified
# during Task 5.7).
http_port 3128
http_access allow all
access_log stdio:/var/log/squid/access.log squid
cache deny all
visible_hostname tg-notify-e2e
