# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  GO_IMAGE: golang:1.24
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/tg-notify/${CI_COMMIT_TAG}

stages:
- test
- secret-detection
- release

build-test:
  stage: test
  image: $GO_IMAGE
  script:
  - go build ./...
  - go vet ./...
  - go test -coverprofile=cover.out ./...
  - go tool cover -func=cover.out
  - go run github.com/boumenot/gocover-cobertura@v1.4.0 < cover.out > coverage.xml
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
  - if: $CI_MERGE_REQUEST_IID
  - if: $CI_COMMIT_BRANCH == "master"

secret_detection:
  stage: secret-detection

build-release:
  stage: release
  image: $GO_IMAGE
  script:
    - make release-all VERSION=$CI_COMMIT_TAG
    - |
      for f in build/tg-notify-*; do
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${PACKAGE_URL}/$(basename "$f")"
      done
  artifacts:
    name: tg-notify-$CI_COMMIT_TAG
    paths:
    - build/tg-notify-*
    expire_in: never
  rules:
  - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build-release]
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'tg-notify $CI_COMMIT_TAG'
    description: 'tg-notify $CI_COMMIT_TAG release. See CHANGELOG.md for details.'
    assets:
      links:
        - name: 'linux-amd64'
          url: '${PACKAGE_URL}/tg-notify-linux-amd64'
        - name: 'linux-386'
          url: '${PACKAGE_URL}/tg-notify-linux-386'
        - name: 'linux-arm64'
          url: '${PACKAGE_URL}/tg-notify-linux-arm64'
        - name: 'linux-arm-v5'
          url: '${PACKAGE_URL}/tg-notify-linux-arm-v5'
        - name: 'linux-arm-v6'
          url: '${PACKAGE_URL}/tg-notify-linux-arm-v6'
        - name: 'linux-arm-v7'
          url: '${PACKAGE_URL}/tg-notify-linux-arm-v7'
        - name: 'linux-riscv64'
          url: '${PACKAGE_URL}/tg-notify-linux-riscv64'
        - name: 'darwin-amd64'
          url: '${PACKAGE_URL}/tg-notify-darwin-amd64'
        - name: 'darwin-arm64'
          url: '${PACKAGE_URL}/tg-notify-darwin-arm64'
        - name: 'windows-amd64'
          url: '${PACKAGE_URL}/tg-notify-windows-amd64.exe'
        - name: 'windows-386'
          url: '${PACKAGE_URL}/tg-notify-windows-386.exe'
        - name: 'windows-arm64'
          url: '${PACKAGE_URL}/tg-notify-windows-arm64.exe'
        - name: 'freebsd-amd64'
          url: '${PACKAGE_URL}/tg-notify-freebsd-amd64'
        - name: 'freebsd-386'
          url: '${PACKAGE_URL}/tg-notify-freebsd-386'
        - name: 'freebsd-arm64'
          url: '${PACKAGE_URL}/tg-notify-freebsd-arm64'
        - name: 'freebsd-arm-v7'
          url: '${PACKAGE_URL}/tg-notify-freebsd-arm-v7'
        - name: 'freebsd-riscv64'
          url: '${PACKAGE_URL}/tg-notify-freebsd-riscv64'
        - name: 'openbsd-amd64'
          url: '${PACKAGE_URL}/tg-notify-openbsd-amd64'
        - name: 'openbsd-386'
          url: '${PACKAGE_URL}/tg-notify-openbsd-386'
        - name: 'openbsd-arm64'
          url: '${PACKAGE_URL}/tg-notify-openbsd-arm64'
        - name: 'openbsd-arm-v7'
          url: '${PACKAGE_URL}/tg-notify-openbsd-arm-v7'
  rules:
  - if: $CI_COMMIT_TAG